name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
    - name: Install requirements
      run: |
         pip install -r requirements.txt
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: run RDRS Program in the bcakground
      run: |
        Start-Job -ScriptBlock { & "python -m rdrs.app.main" }
    - name: Test with pytest
      env:
        PYTHONPATH: rdrs
      run: |
       python -m pytest rdrs/tests/
    - name: Modify index.html using PowerShell
      shell: powershell # Forces the step to execute via PowerShell
      run: |
          # Define the target file path
          $filePath = "index.html"
          $currentDate = (Get-Date).ToString("yyyy-MM-dd HH:mm:ss")
          
          # Example 1: Replace a specific text placeholder
          if (Test-Path $filePath) {
              $content = Get-Content $filePath -Raw
              $newContent = $content -replace "Last updated:.*", "Last updated: $currentDate"
              Set-Content -Path $filePath -Value $newContent
          } else {
              # Example 2: Create a fresh index.html if it doesn't exist
              @"
              <!DOCTYPE html>
              <html>
              <body>
                  <h1>Automated Page</h1>
                  <p>Last updated: $currentDate</p>
              </body>
              </html>
              "@ | Set-Content -Path $filePath
          }

    - name: Commit and push changes
      shell: powershell
      run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          git add index.html
          
          # Check for changes to prevent empty commit errors
          $status = git status --porcelain index.html
          if ($status) {
              git commit -m "Auto-update index.html via PowerShell workflow"
              git push
          } else {
              Write-Output "No changes detected in index.html"
          }
          file_pattern: index.html
          commit_message: "Auto-update index.html via workflow"
          commit_hanumantaraoa: github-actions[bot]
          commit_hanumantaraoa@gmail.com: 41898282+github-actions[bot]@users.noreply.github.com
