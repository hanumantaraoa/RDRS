name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
    - name: Install requirements
      run: |
         pip install -r requirements.txt
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: run RDRS Program in the bcakground
      run: |
        python -m rdrs.app.main &
    - name: Test with pytest
      env:
        PYTHONPATH: rdrs
      run: |
       python -m pytest rdrs/tests/
    - name: Modify index.html
      run: |
          # Example: Update a timestamp or run a script/command
          echo "Last updated: $(date)" > timestamp.txt
          # Or inject/replace content in index.html:
          sed -i 's/Last run: .*/Last run: $(date)/g' index.html
          # Or run your custom script/generator:
          # python generate_html.py

    - name: Auto-commit index.html
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
          file_pattern: index.html
          commit_message: "Auto-update index.html via workflow"
          commit_hanumantaraoa: github-actions[bot]
          commit_hanumantaraoa@gmail.com: 41898282+github-actions[bot]@users.noreply.github.com
