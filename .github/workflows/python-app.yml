# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
    - name: Install requirements
      run: |
       if (Test-Path "requirements.txt") {
              pip install -r requirements.txt
          }
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: run RDRS Program in the bcakground
      run: |
         Start-Job -ScriptBlock { & "python -m rdrs.app.main" }
    - name: Test with pytest
      env:
        PYTHONPATH: rdrs
      run: |
        python -m pytest rdrs/tests
        python rdrs/tests/test_atak.py
    - name: Modify index.html
      run:  |
          git config --global hanumantaraoa.hanumantaraoa "github-actions[bot]"
          git config --global hanumantaraoa@gmail.com "github-actions[bot]@://github.com"
          git add index.html
          
          # Check if there are changes staged for commit
          git diff --quiet --staged
          if ($LASTEXITCODE -ne 0) {
              git commit -m "Update index.html"
              git push
          } else {
              Write-Output "No changes to commit."
          }
