name: Run Python App on Self-Hosted Runner

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to manually trigger the workflow from GitHub UI

jobs:
  run-app:
    # 'self-hosted' tells GitHub not to use its own VMs. 
    # Add custom labels like 'linux', 'windows', or 'production' if needed to target specific runners.
    runs-on: [self-hosted] 

    steps:
      # Step 1: Pull the latest code from your repository onto the self-hosted machine
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Use the pre-installed Python on your runner or set up a specific version.
      # Note: 'actions/setup-python' works on self-hosted runners but requires internet access 
      # to download toolcache versions if they are not already cached locally.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Change to your preferred Python version

      # Step 3: Install application dependencies
      # Good Practice: Upgrading pip and using a virtual environment or cache if necessary.
      # Because it's a self-hosted runner, dependencies persist unless you clean them up.
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if ( -f requirements.txt ) then pip install -r requirements.txt; fi

      # Step 4: Run your Python application or its test suite
      - name: Run Python Application
        run: |
          python app.main.py
