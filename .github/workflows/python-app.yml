# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
name: Load and Read YAML Config
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
workflow_dispatch: # Allows you to manually trigger the workflow

jobs:
  read-yaml-job:
    runs-on: ubuntu-latest
    steps:
    # Step 1: Check out the repository code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Load the YAML file
    - name: Load YAML configuration
      id: read_config
      uses: step-security/action-read-yaml@v1
      with:
      config: ${{ github.workspace }}/rdrs/config.yaml

    # Step 3: Access and display loaded variables
    - name: Use values from YAML
      run: |
          echo "The environment is: ${{ steps.read_config.outputs['environment'] }}"
          echo "The database host is: ${{ steps.read_config.outputs['database.host'] }}"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m venv .venv
        source .venv/bin/activate
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      #background: python -m rdrs.app.main.py
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        python rdrs.app.main
