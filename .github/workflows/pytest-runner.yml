name: Ransomware Defense System Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: self-hosted  # Tells GitHub to use your self-hosted runner
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Match your project version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov  # Installs pytest and coverage tools

      - name: Run Pytest
        run: |
          python -m pytest --cov=src --junitxml=pytest-report.xml /tests
        env:
          TEST_ENV: CI
          # Add any environment variables or safe mock-malware paths needed here

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always() # Ensures reports upload even if tests fail
        with:
          name: pytest-results
          path: |
            pytest-report.xml
            htmlcov/
