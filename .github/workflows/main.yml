name: Run Python Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to trigger the workflow manually

jobs:
  build-and-run:
    # Crucial: Tells GitHub to use your own self-hosted runner instead of cloud infrastructure
    runs-on: self-hosted

    steps:
      # Step 1: Download the repository code to the self-hosted runner machine
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Configure the required Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Specify your required Python version
          cache: 'pip'           # Optional: Caches dependencies to speed up subsequent runs

      # Step 3: Install all application requirements
      - name: Install dependencies
        run: python -m venv venv
          source venv/bin/activate  # Use 'venv\Scripts\activate' if your self-hosted runner is Windows
          pip install --upgrade pip|
          if ( -f requirements.txt ); then pip install -r requirements.txt; fi

      # Step 4: Run your linting, tests, or primary application script
      - name: Run Python Application
        run: |
          python rdrs.app.main 
